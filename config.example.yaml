# ====================================
# 阿里云 DashScope API 配置
# ====================================
dashscope:
  # API Key（必填）
  # 获取地址：https://www.alibabacloud.com/help/zh/model-studio/get-api-key
  # 注意：北京和新加坡地域的API Key不同，不可混用
  api_key: your_dashscope_api_key_here

  # API地域选择：beijing 或 singapore（必填）
  # beijing: https://dashscope.aliyuncs.com
  # singapore: https://dashscope-intl.aliyuncs.com
  region: singapore


# ====================================
# 字节跳动 Seedance API 配置（Ark）
# ====================================
seedance:
  # API Key（可选：仅在使用 Seedance 接口时需要）
  # 获取地址：https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
  api_key: your_seedance_api_key_here

  # API Base URL（可选）
  base_url: https://ark.cn-beijing.volces.com


# ====================================
# AWS S3 配置
# ====================================
s3:
  # AWS Access Key ID（必填）
  # 获取地址：https://console.aws.amazon.com/iam/
  access_key_id: your_s3_access_key_id_here

  # AWS Secret Access Key（必填）
  secret_access_key: your_s3_secret_access_key_here

  # S3 Bucket 名称（必填）
  bucket_name: your_bucket_name_here

  # AWS 地域（必填）
  region: us-east-1

  # S3 存储路径配置（可选）
  paths:
    # 上传的图片存储路径前缀
    images: video-creator-demo/images/

    # 上传的音频存储路径前缀
    audios: video-creator-demo/audios/

    # 上传的参考视频存储路径前缀
    reference_videos: video-creator-demo/reference-videos/

    # 生成的视频存储路径前缀
    output_videos: video-creator-demo/output-videos/

  # 签名URL过期时间（秒，默认24小时）（可选）
  url_expiration: 86400


# ====================================
# 应用配置
# ====================================
app:
  # 应用运行端口（可选）
  port: 8000

  # 应用运行主机（可选）
  host: 0.0.0.0

  # 调试模式（可选）
  debug: true

  # 日志级别（可选）
  # 可选值：DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: INFO
